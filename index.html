<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>หน้าไว้อาลัย | นักสร้างสุขดอนแก้ว</title>

  <meta
    name="description"
    content="หน้าไว้อาลัยของนักสร้างสุขดอนแก้ว"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      font-family: Arial, sans-serif;
    }

    .memorial-link {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      width: 100%;
      height: 100%;

      background: #000;

      cursor: pointer;
      text-decoration: none;

      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .memorial-image {
      width: 100%;
      height: 100%;

      object-fit: contain;
      object-position: center;

      display: block;

      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .memorial-link:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: -6px;
    }
  </style>
</head>

<body>

  <a
    class="memorial-link"
    href="https://script.google.com/macros/s/AKfycbxYZNy_pJzM8Q6rQ0GzU53ELH5nUyrDfExcqyzxqi7NE1iMZdPn446kKjvKVOy5Ce9IkQ/exec"
    aria-label="เข้าสู่เว็บไซต์ระบบรายงานนักสร้างสุข."
  >
    <img
      class="memorial-image"
      src="assets/img/memorial.png"
      alt="หน้าไว้อาลัย"
      draggable="false"
    >
  </a>

</body>
</html>
